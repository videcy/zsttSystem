services:
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: zstt_chromadb
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:2026.06.0
    container_name: zstt_neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://127.0.0.1:7687
          -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1"
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  chroma_data:
  neo4j_data:
